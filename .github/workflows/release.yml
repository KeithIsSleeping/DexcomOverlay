name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore DexcomOverlay/DexcomOverlay.csproj

      - name: Run tests
        run: dotnet test DexcomOverlay.Tests/DexcomOverlay.Tests.csproj --configuration Release --verbosity normal

      - name: Publish
        run: >
          dotnet publish DexcomOverlay/DexcomOverlay.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/DexcomOverlay.exe
          generate_release_notes: true
